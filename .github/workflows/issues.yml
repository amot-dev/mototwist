name: Close Issues on Release
run-name: Close Issues for Release ${{ github.event.release.tag_name }}

on:
  release:
    types: [published]

jobs:
  close-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Close issues mentioned in release
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUES=$(echo "$RELEASE_BODY" | grep -oP '#\d+' | sed 's/#//' || true)

          if [ -z "$ISSUES" ]; then
            echo "No issue numbers found."
            exit 0
          fi

          for ISSUE in $ISSUES; do
            echo "Closing issue #$ISSUE"
            gh issue close "$ISSUE" \
              --repo "${{ github.repository }}" \
              --comment "Automatically closed by Release ${{ github.event.release.tag_name }}"
          done
